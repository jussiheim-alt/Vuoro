# Render Blueprint — Vuoro
# https://render.com/docs/blueprint-spec
#
# After connecting the GitHub repo in Render Dashboard:
#   1. Set env vars ADMIN_PASSWORD + SESSION_SECRET (generate a long random secret)
#   2. Optional: ADMIN_USERNAME (default: vuoro)
#   3. Attach the disk below so users + sync data survive redeploys

services:
  - type: web
    name: vuoro
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        value: jussi
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: vuoro-data
      mountPath: /var/data
      sizeGB: 1
