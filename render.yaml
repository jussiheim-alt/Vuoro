# Vuoro — esitelmäsuunnittelu (Express + node:sqlite)
services:
  - type: web
    name: vuoro
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: vuoro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: jussi
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Jussi Heimonen
