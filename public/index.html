<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=289c3093-f93f-4730-b808-d6c104df1789
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3b5bdb">
<title>Vuoro · Ajanvaraus</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e4e8f0;
    --ink:#1d2433; --ink-soft:#5b6678; --ink-faint:#8a94a6;
    --brand:#3b5bdb; --brand-d:#2f49b0; --brand-soft:#e8edff;
    --ok:#2f9e6f; --ok-soft:#e3f5ec;
    --warn:#e8852b; --warn-soft:#fcefe0;
    --danger:#d6455d; --danger-soft:#fbe6ea;
    --shadow:0 6px 22px rgba(29,36,51,.10);
    --shadow-sm:0 2px 8px rgba(29,36,51,.08);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px 80px;}

  .topbar{position:sticky;top:0;z-index:30;background:var(--card);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;
    gap:14px;padding:10px 16px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;}
  .logo .dot{width:30px;height:30px;border-radius:9px;background:var(--brand);overflow:hidden;
    color:#fff;display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .daypick button{padding:8px 0;border:1.5px solid var(--line);background:#fff;
    border-radius:9px;font-weight:700;font-size:.82rem;color:var(--ink-soft);cursor:pointer;transition:all .12s;}
  .daypick button:hover{border-color:var(--brand);}
  .daypick button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .logo .sub{font-size:.66rem;font-weight:600;color:var(--ink-faint);
    letter-spacing:.5px;text-transform:uppercase;}
  .spacer{flex:1;}
  .ctrl{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-soft);}
  select.pill{font-family:inherit;font-size:.84rem;padding:7px 10px;border-radius:10px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;cursor:pointer;}
  .rolepill{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;border:1.5px solid var(--line);}
  .rolepill button{border:none;background:transparent;padding:6px 12px;border-radius:8px;
    font-size:.82rem;font-weight:700;color:var(--ink-soft);}
  .rolepill button.on{background:var(--brand);color:#fff;box-shadow:var(--shadow-sm);}
  #acct{display:flex;align-items:center;gap:8px;font-size:.84rem;}
  .who{font-weight:700;color:var(--ink);}
  .linklike{border:none;background:transparent;color:var(--brand);font-weight:700;
    font-size:.82rem;text-decoration:underline;padding:4px;}
  .devtag{font-size:.6rem;font-weight:700;background:var(--warn-soft);color:var(--warn);
    padding:2px 6px;border-radius:6px;letter-spacing:.3px;}

  .btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);
    border-radius:10px;padding:8px 12px;font-weight:600;font-size:.86rem;}
  .btn:hover{background:var(--bg);}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn.primary:hover{background:var(--brand-d);}
  .btn.small{padding:6px 11px;font-size:.82rem;}
  .btn.danger{color:var(--danger);border-color:var(--danger-soft);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-top:18px;}
  .cal-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .cal-title{font-size:1.25rem;font-weight:800;min-width:200px;text-transform:capitalize;}
  .nav{display:flex;gap:6px;}
  .nav button{border:1.5px solid var(--line);background:#fff;color:var(--ink);
    border-radius:10px;padding:8px 12px;font-weight:600;font-size:.86rem;}
  .nav button:hover{background:var(--bg);}
  .viewseg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;border:1.5px solid var(--line);}
  .viewseg button{border:none;background:transparent;padding:7px 14px;border-radius:8px;
    font-size:.84rem;font-weight:700;color:var(--ink-soft);}
  .viewseg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm);}

  .month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .dow{text-align:center;font-size:.72rem;font-weight:700;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.5px;padding:4px 0;}
  .day{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:6px;
    background:#fff;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .12s,background .12s;}
  .day:hover{border-color:var(--brand);background:#fbfcff;}
  .day.dim{background:#fafbfd;color:var(--ink-faint);}
  .day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);}
  .day .dnum{font-size:.82rem;font-weight:700;align-self:flex-end;}
  .day.today .dnum{background:var(--brand);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;}
  .chip{font-size:.7rem;font-weight:600;padding:3px 6px;border-radius:6px;
    background:var(--brand-soft);color:var(--brand-d);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;border-left:3px solid var(--brand);}
  .chip.sub{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn);}
  .chip.full{background:var(--danger-soft);color:var(--danger);border-left-color:var(--danger);}
  .more{font-size:.68rem;color:var(--ink-faint);font-weight:600;}

  .tg{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .tg-head{display:grid;background:var(--bg);border-bottom:1px solid var(--line);}
  .tg-head .cell{padding:8px 4px;text-align:center;font-size:.74rem;font-weight:700;
    color:var(--ink-soft);border-left:1px solid var(--line);}
  .tg-head .cell:first-child{border-left:none;}
  .tg-head .cell .dn{font-size:1.05rem;color:var(--ink);}
  .tg-head .cell.today .dn{color:var(--brand);}
  .tg-body{display:grid;position:relative;max-height:560px;overflow-y:auto;}
  .tg-row{display:grid;border-top:1px solid var(--line);min-height:48px;}
  .tg-row .hr{font-size:.68rem;color:var(--ink-faint);padding:2px 6px;text-align:right;border-right:1px solid var(--line);}
  .tg-col{border-left:1px solid var(--line);position:relative;padding:2px;}
  .tg-col:first-of-type{border-left:none;}
  .ev{background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:6px;
    padding:4px 6px;margin-bottom:3px;font-size:.74rem;cursor:pointer;line-height:1.25;}
  .ev:hover{filter:brightness(.97);}
  .ev b{display:block;font-weight:700;color:var(--brand-d);}
  .ev.sub{background:var(--warn-soft);border-left-color:var(--warn);}
  .ev.sub b{color:var(--warn);}
  .ev .t{color:var(--ink-soft);font-size:.7rem;}

  .sec-title{display:flex;align-items:center;gap:10px;margin:24px 2px 12px;}
  .sec-title h2{font-size:1.1rem;font-weight:800;}
  .sec-title .count{background:var(--brand-soft);color:var(--brand-d);font-size:.74rem;
    font-weight:700;padding:3px 9px;border-radius:20px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .ecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
    transition:transform .1s,box-shadow .12s,border-color .12s;border-top:4px solid var(--brand);}
  .ecard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand);}
  .ecard.sub{border-top-color:var(--warn);}
  .ecard h3{font-size:1rem;font-weight:700;margin-bottom:8px;line-height:1.3;}
  .ecard .date{font-size:.82rem;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px;}
  .ecard .badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .badge{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:20px;}
  .badge.b-sub{background:var(--warn-soft);color:var(--warn);}
  .badge.b-cap{background:var(--ok-soft);color:var(--ok);}
  .badge.b-full{background:var(--danger-soft);color:var(--danger);}
  .badge.b-mine{background:var(--brand-soft);color:var(--brand-d);}
  .empty{color:var(--ink-faint);font-size:.9rem;padding:30px;text-align:center;
    border:2px dashed var(--line);border-radius:12px;grid-column:1/-1;}

  .overlay{position:fixed;inset:0;background:rgba(20,26,40,.5);z-index:50;
    display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;}
  .overlay.on{display:flex;}
  #calOverlay{z-index:60;} #authOverlay{z-index:70;}
  .modal{background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);
    width:100%;max-width:540px;overflow:hidden;animation:pop .15s ease;height:fit-content;}
  @keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0;}to{transform:none;opacity:1;}}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);position:relative;}
  .modal-head.sub-h{background:var(--warn-soft);}
  .modal-head h3{font-size:1.25rem;font-weight:800;padding-right:30px;}
  .modal-head .meta{font-size:.86rem;color:var(--ink-soft);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px;}
  .modal-head .x{position:absolute;top:14px;right:16px;border:none;background:transparent;
    font-size:1.5rem;color:var(--ink-faint);line-height:1;}
  .modal-body{padding:18px 20px;}
  .row{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-bottom:10px;color:var(--ink-soft);}
  .row b{color:var(--ink);}
  .capbar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0 14px;}
  .capbar i{display:block;height:100%;background:var(--ok);border-radius:6px;}
  .capbar i.full{background:var(--danger);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px;}

  .reglist{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .reglist-h{background:var(--bg);padding:10px 14px;font-weight:700;font-size:.9rem;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mini{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;
    font-size:.78rem;font-weight:700;color:var(--brand);}
  .reg-empty{padding:14px;font-size:.85rem;color:var(--ink-faint);}
  .reg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-top:1px solid var(--line);}
  .reg b{font-size:.9rem;}
  .reg-c{font-size:.76rem;color:var(--ink-soft);margin-top:2px;}
  .tag-coach{font-size:.64rem;font-weight:700;background:var(--warn-soft);color:var(--warn);
    padding:2px 6px;border-radius:10px;margin-left:4px;}
  .rmx{border:none;background:var(--danger-soft);color:var(--danger);width:28px;height:28px;
    border-radius:8px;font-size:.9rem;font-weight:700;flex-shrink:0;}
  .rmx:hover{background:var(--danger);color:#fff;}
  .addreg{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:12px 14px;border-top:1px solid var(--line);background:#fbfcff;}
  .addreg input{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:.84rem;}
  .addreg input:first-child{grid-column:1/3;}
  .addreg input:focus{outline:none;border-color:var(--brand);}

  .subbox{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .subbox-head{background:var(--warn-soft);padding:10px 14px;display:flex;align-items:center;gap:8px;
    font-weight:700;font-size:.9rem;color:var(--warn);}
  .reason{padding:10px 14px;font-size:.86rem;color:var(--ink-soft);border-bottom:1px solid var(--line);}
  .chat{max-height:230px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fbfcff;}
  .msg{max-width:80%;padding:8px 11px;border-radius:12px;font-size:.86rem;line-height:1.35;}
  .msg .who{font-size:.68rem;font-weight:700;opacity:.75;margin-bottom:2px;}
  .msg.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px;}
  .msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
  .msg.sys{align-self:center;background:transparent;color:var(--ink-faint);font-size:.74rem;font-style:italic;text-align:center;}
  .chat-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fff;}
  .chat-in input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.88rem;}
  .chat-in input:focus{outline:none;border-color:var(--brand);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);
    margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
  .field label .req{color:var(--danger);}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:.9rem;}
  .field input:focus{outline:none;border-color:var(--brand);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{font-size:.78rem;color:var(--ink-faint);margin-top:8px;line-height:1.5;}
  .switchline{font-size:.84rem;color:var(--ink-soft);margin-top:14px;text-align:center;}

  .calbtns{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
  .calbtn{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;
    border-radius:12px;padding:12px 14px;font-size:.92rem;font-weight:600;color:var(--ink);text-align:left;}
  .calbtn:hover{border-color:var(--brand);background:#fbfcff;}
  .calbtn .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0;}
  .ic.apple{background:#000;color:#fff;} .ic.google{background:#fff;border:1px solid var(--line);}
  .ic.outlook{background:#0a6fc2;color:#fff;}

  /* management modal */
  .tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:16px;}
  .tabs button{flex:1;border:none;background:transparent;padding:8px;border-radius:8px;
    font-weight:700;font-size:.85rem;color:var(--ink-soft);}
  .tabs button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm);}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);}
  .mrow:first-of-type{border-top:none;}
  .mrow .mname{font-weight:700;font-size:.92rem;}
  .mrow .msub{font-size:.76rem;color:var(--ink-soft);margin-top:2px;}
  .pill-role{font-size:.66rem;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
  .pill-role.owner{background:#ede9fe;color:#6d28d9;} .pill-role.coach{background:var(--brand-soft);color:var(--brand-d);}
  .pill-role.customer{background:var(--bg);color:var(--ink-soft);} .pill-role.superadmin{background:#fde68a;color:#92400e;}
  .pill-role.pending{background:var(--warn-soft);color:var(--warn);}
  .codebox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.78rem;}
  .codebox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);}
  .sec-h{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin:18px 0 6px;}
  .inviteform{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:6px;}
  .inviteform input,.inviteform select{border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;font-family:inherit;font-size:.86rem;}
  @media(max-width:560px){.inviteform{grid-template-columns:1fr;}}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:.88rem;font-weight:600;
    z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .25s;max-width:90vw;text-align:center;}
  .toast.on{transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--danger);}
  .loading{padding:40px;text-align:center;color:var(--ink-faint);font-size:.9rem;}
  @media(max-width:560px){.cal-title{min-width:auto;font-size:1.05rem;}.day{min-height:70px;}
    .addreg{grid-template-columns:1fr;}.addreg input:first-child{grid-column:1;}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-in">
      <div class="logo">
        <span class="dot" id="brandDot">V</span>
        <div>
          <div id="brandName">Vuoro</div>
          <div class="sub" id="brandTenant">—</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="ctrl" id="tenantCtrl">
        <span>🏢</span>
        <select class="pill" id="tenantSel" title="Vaihda yritystä (tenant)"></select>
      </div>
      <span class="devtag" id="devTag" style="display:none">DEV</span>
      <div class="rolepill" id="roleSel" title="Demo-identiteetti (dev)">
        <button data-id="public">Julkinen</button>
        <button data-id="coach">Valmentaja</button>
        <button data-id="customer">Asiakas</button>
      </div>
      <button class="btn small" id="apprBtn" style="display:none">✅ Hyväksynnät</button>
      <button class="btn small" id="myBtn" style="display:none">📋 Omat varaukset</button>
      <button class="btn small" id="mgmtBtn" style="display:none">⚙ Hallinta</button>
      <div id="acct"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="cal-head">
        <div class="cal-title" id="calTitle">—</div>
        <div class="nav">
          <button id="prevBtn">‹</button>
          <button id="todayBtn">Tänään</button>
          <button id="nextBtn">›</button>
        </div>
        <div class="spacer"></div>
        <div class="viewseg" id="viewSeg">
          <button data-view="day">Päivä</button>
          <button data-view="week">Viikko</button>
          <button data-view="month">Kuukausi</button>
        </div>
        <button class="btn primary" id="addBtn" style="display:none">+ Uusi treeni</button>
      </div>
      <div id="calBody"><div class="loading">Ladataan…</div></div>
    </div>

    <div class="sec-title">
      <h2>Tulevat treenit</h2>
      <span class="count" id="cardCount">0</span>
    </div>
    <div class="cards" id="cards"></div>

    <div class="sec-title" id="spotSec" style="display:none">
      <h2>🔁 Sijaispyynnöt</h2>
      <span class="count" id="spotCount">0</span>
    </div>
    <div class="cards" id="spotCards"></div>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="overlay" id="formOverlay"><div class="modal" id="formModal"></div></div>
  <div class="overlay" id="calOverlay"><div class="modal" id="calModal"></div></div>
  <div class="overlay" id="authOverlay"><div class="modal" id="authModal"></div></div>
  <div class="overlay" id="mgmtOverlay"><div class="modal" id="mgmtModal" style="max-width:660px"></div></div>
  <div class="overlay" id="myOverlay"><div class="modal" id="myModal"></div></div>
  <div class="overlay" id="apprOverlay"><div class="modal" id="apprModal"></div></div>
  <div class="overlay" id="spotOverlay"><div class="modal" id="spotModal"></div></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
